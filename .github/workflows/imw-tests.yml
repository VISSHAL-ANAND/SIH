name: IMW tests

on:
  push:
    branches:
      - "phase-2/imw-real-pipeline"
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run IMW tests
        run: python -m pytest tests/test_rf_corroboration.py tests/test_incident_package.py tests/test_imw_e2e_contract.py -q
